name: Run New ETL Pipeline

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily (full run)
    - cron: '0 8 * * *'   # 08:00 UTC daily (retry missing countries)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------
      # Checkout repo
      # -------------------
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------
      # Setup Python
      # -------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -------------------
      # Install dependencies
      # -------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install geckodriver for Selenium (Firefox is pre-installed on runner)
          # Remove any pre-existing geckodriver that might conflict
          sudo rm -f /usr/local/bin/geckodriver
          GECKO_VER="v0.37.1"
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VER}/geckodriver-${GECKO_VER}-linux64.tar.gz"
          tar -xzf "geckodriver-${GECKO_VER}-linux64.tar.gz"
          sudo mv geckodriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/geckodriver
          rm "geckodriver-${GECKO_VER}-linux64.tar.gz"
          geckodriver --version
          firefox --version || true

      # -------------------
      # Run ETL script
      # -------------------
      
      - name: Determine run mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 8 * * *" ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Mode: Retry missing countries"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "Mode: Full ETL run"
          fi

      - name: Run many countries
        run: |
          if [ "${{ steps.mode.outputs.retry }}" = "true" ]; then
            python main.py --retry
          else
            python main.py
          fi
        continue-on-error: true

      # -------------------
      # Debug
      # -------------------
      - name: Debug changes
        run: |
          ls -lh
          echo "Checking git status..."
          git status

      # -------------------
      # Commit if changed
      # -------------------
      - name: Commit updated csv
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/raw/ExchangeRates.csv

          if ! git diff-index --cached --quiet HEAD; then
            git commit -m "Update exchange rates"
            git fetch origin main
            git pull --rebase origin main || git rebase --abort || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
            
            echo "csv updated and pushed."
          else
            echo "No changes to commit"
          fi